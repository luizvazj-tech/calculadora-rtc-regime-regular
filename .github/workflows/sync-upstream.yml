name: Sincronizar com a Receita Federal

# Espelha diariamente a branch main do repositório oficial
# (ReceitaFederal/calculadora-rtc-regime-regular) neste fork.
# A main deste fork recebe o conteúdo da Receita por mesclagem; este workflow é o único acréscimo próprio.
# Alterações da sua ferramenta devem ficar em outro branch, para evitar conflitos.
on:
  schedule:
    - cron: '17 9 * * *'   # diariamente, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:        # permite executar manualmente na aba Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mesclar upstream
        run: |
          git remote add upstream https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            echo "::error::Conflito ao mesclar a Receita Federal. Resolva manualmente (alterações próprias devem ficar em outro branch)."
            exit 1
          fi
